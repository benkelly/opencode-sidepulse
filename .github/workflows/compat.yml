name: compat

# Runs the plugin against real releases of the two programs it sits between. The pinned
# entries are regression tests. The floating ones (SidePulse main, the latest OpenCode)
# also run every week, so a breaking change upstream shows up here first.
#
# None of these jobs gate the npm release. That is the `test` job in ci.yml.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # OpenCode runs plugins under Bun. ci.yml runs the same suite under Node.
  bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun plugin.mjs
      - run: bun test/run.mjs

  # Installs SidePulse at one commit, starts its real service, and drives the plugin
  # against it. The first entry has no `sidepulse report`, so the plugin must fall back to
  # the device.
  sidepulse:
    name: sidepulse ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 2026-10-13, before sidepulse report
            ref: ffb1d3c2f3eed3b7e80e32d7876a7e1d67bd5dfb
            args: --legacy
          - name: 2026-11-10, first with sidepulse report
            ref: ad4a5217fd3a833cfa2a12e1eaf055f22948cd53
          - name: 2026-11-12
            ref: 20ca7fdd6645ba070af607e24587084b6f809275
          - name: main
            ref: main
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: inteliwear/sidepulse
          ref: ${{ matrix.ref }}
          path: upstream
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: python -m venv .venv && .venv/bin/pip install ./upstream
      - run: .venv/bin/sidepulse --version
      - run: node test/service.mjs ${{ matrix.args }}
        env:
          SIDEPULSE_BIN: ${{ github.workspace }}/.venv/bin/sidepulse

  # Installs one OpenCode release and runs real turns in it with the plugin loaded.
  # OpenCode's free models need no account, so there are no secrets here. 1.18.0 is the
  # oldest release the free models accept.
  opencode:
    name: opencode ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: opencode-ai
            version: 1.18.0
          - package: opencode-ai
            version: 1.19.5
          - package: "@opencode/cli"
            version: 2.1.2
          - package: "@opencode/cli"
            version: 2.3.0
          - package: "@opencode/cli"
            version: latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: npm install --global "${{ matrix.package }}@${{ matrix.version }}"
      - run: opencode --version
      - run: node test/opencode.mjs
